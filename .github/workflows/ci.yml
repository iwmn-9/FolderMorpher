name: "CI Regression Gate"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: "Build & Automated Regression Tests"
    runs-on: windows-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Setup .NET SDK 10.0"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: "Build & Run Regression Test Suite"
        run: |
          dotnet build -c Release
          ./tools/Test-LicenseNotices.ps1
          dotnet run -c Release --no-build -- --test-regression
      - name: "GUI / Host IPC and Search Freshness"
        run: dotnet run -c Release --no-build -- --test-ipc
