name: "💡 Feature Request"
description: Suggest an idea, enhancement, or new feature for FolderMorpher.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make FolderMorpher better? Tell us about your use case!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is. Ex. I'm always frustrated when [...]
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
